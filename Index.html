<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Countdown to July 18, 2026</title>

<style>
    body{
        margin:0;
        padding:0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        text-align:center;
    }

    .container{
        background: rgba(255,255,255,0.08);
        padding:40px;
        border-radius:20px;
        backdrop-filter: blur(10px);
        box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    h1{
        margin-bottom:30px;
        font-size:32px;
        letter-spacing:1px;
    }

    .countdown{
        display:flex;
        gap:20px;
        justify-content:center;
        flex-wrap:wrap;
    }

    .box{
        background:rgba(0,0,0,0.3);
        padding:20px 25px;
        border-radius:15px;
        min-width:90px;
    }

    .number{
        font-size:40px;
        font-weight:bold;
    }

    .label{
        font-size:14px;
        margin-top:5px;
        opacity:0.8;
        letter-spacing:1px;
    }

    .finished{
        font-size:28px;
        color:#00ffcc;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Countdown to July 18, 2026</h1>

    <div class="countdown">
        <div class="box">
            <div id="days" class="number">0</div>
            <div class="label">Days</div>
        </div>
        <div class="box">
            <div id="hours" class="number">0</div>
            <div class="label">Hours</div>
        </div>
        <div class="box">
            <div id="minutes" class="number">0</div>
            <div class="label">Minutes</div>
        </div>
        <div class="box">
            <div id="seconds" class="number">0</div>
            <div class="label">Seconds</div>
        </div>
    </div>

    <div id="message" style="margin-top:25px;"></div>
</div>

<script>
    const targetDate = new Date("July 18, 2026 00:00:00").getTime();

    function updateCountdown(){
        const now = new Date().getTime();
        const diff = targetDate - now;

        if(diff <= 0){
            document.querySelector(".countdown").style.display="none";
            document.getElementById("message").innerHTML =
                "<div class='finished'>🎉 Countdown Finished!</div>";
            return;
        }

        const days = Math.floor(diff / (1000*60*60*24));
        const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
        const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
        const seconds = Math.floor((diff % (1000*60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;
    }

    updateCountdown();
    setInterval(updateCountdown,1000);
</script>

</body>
</html>
