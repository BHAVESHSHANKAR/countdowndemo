<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Circle</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top,#0f2027,#203a43,#2c5364);
    font-family: Arial, Helvetica, sans-serif;
    color:white;
}

.container{
    text-align:center;
}

h1{
    margin-bottom:40px;
    letter-spacing:1px;
    font-weight:500;
}

.circle-wrapper{
    position:relative;
    width:260px;
    height:260px;
    display:flex;
    justify-content:center;
    align-items:center;
}

svg{
    position:absolute;
    transform:rotate(-90deg);
}

circle{
    fill:none;
    stroke-width:12;
    stroke-linecap:round;
}

.bg{
    stroke:rgba(255,255,255,0.15);
}

.progress{
    stroke:#00ffd5;
    stroke-dasharray:754;
    stroke-dashoffset:0;
    transition:stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 10px #00ffd5);
}

.days{
    position:absolute;
    font-size:64px;
    font-weight:bold;
}

.label{
    margin-top:20px;
    opacity:0.7;
    letter-spacing:2px;
}

.finished{
    font-size:32px;
    color:#00ffd5;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>Countdown to July 18, 2026</h1>

    <div class="circle-wrapper">
        <svg width="260" height="260">
            <circle class="bg" cx="130" cy="130" r="120"></circle>
            <circle id="progressCircle" class="progress" cx="130" cy="130" r="120"></circle>
        </svg>

        <div id="days" class="days">0</div>
    </div>

    <div class="label">DAYS LEFT</div>
    <div id="message" style="margin-top:25px;"></div>
</div>

<script>
const targetDate = new Date("July 18, 2026 00:00:00").getTime();
const startDate = new Date().getTime();

const totalDuration = targetDate - startDate;

const circle = document.getElementById("progressCircle");
const circumference = 2 * Math.PI * 120;
circle.style.strokeDasharray = circumference;

function updateCountdown(){

    const now = new Date().getTime();
    const diff = targetDate - now;

    if(diff <= 0){
        document.getElementById("days").innerHTML = "0";
        document.getElementById("message").innerHTML =
            "<div class='finished'>🎉 Time Reached!</div>";
        circle.style.strokeDashoffset = circumference;
        return;
    }

    const days = Math.ceil(diff / (1000*60*60*24));
    document.getElementById("days").innerHTML = days;

    const elapsed = now - startDate;
    const progress = elapsed / totalDuration;
    const offset = circumference * progress;

    circle.style.strokeDashoffset = offset;
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>

</body>
</html>
